[package]
name = "handybox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
age = "0.12"
anydoc = "=0.2.4"
anyhow.workspace = true
# One decoder, for one job: the names in a ZIP that predate UTF-8. Already in
# this tree behind rxing, so naming it here costs nothing.
encoding_rs = "0.8"
# Decoding only, and only the formats the barcode reader offers to open. The
# default set would pull AVIF and OpenEXR encoders in for no one.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico", "tga", "qoi", "pnm"] }
# Resizing quality that a naive nearest-neighbour loop cannot reach, with SIMD
# paths on the platforms this ships to.
fast_image_resize = { version = "6", features = ["image"] }
jaq-core = "3"
jaq-json = "2"
jaq-std = "3"
# Recognition reads grayscale, which the image crate already gives us, so rxing's
# own `image` feature (and the imageproc tree behind it) stays out of the build.
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs"] }
# EXIF only: no writing, no media containers beyond what a camera file is.
nom-exif = "3"
# Lossless PNG optimization. Its own CLI, logging and zopfli are left out: the
# first is not a library concern and the last trades minutes for a few per cent.
oxipng = { version = "10", default-features = false, features = ["parallel"] }
serde_json = "1"
# Pinned to the 0.20 line: from 0.21 the crate needs a newer Rust than this
# workspace pins. Reading and writing LZMA2 comes from the crate itself, so the
# only feature asked for is the encoder; the default set adds AES, bzip2 and
# PPMd, which is a password prompt this tool does not have and two codecs
# almost no 7z file in the wild uses.
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress"] }
sha2 = "0.10"
similar = "3"
tempfile.workspace = true
# Disk cleanup never unlinks anything: what it removes goes to the platform's
# own trash, where a wrong click is recoverable.
trash = "5"
# ZIP, read and written. Deflate through flate2, which the PNG codecs already
# put in this tree, and LZMA through lzma-rust2, which 7z brings anyway; the
# default set would add zopfli, zstd, xz, bzip2, AES and a date library.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2", "lzma"] }

[dev-dependencies]
# Writing barcodes is a test fixture, not a feature: the tests draw the codes
# they then ask the reader to recognize.
rxing = { version = "0.9.2", default-features = false, features = ["encoders"] }
