<!doctype html>
<!-- The page HandyBox serves to the other devices on the network.
     Both languages live here; the server replaces __HANDYBOX_LANG__ with the
     one the desktop is showing. The API never sends display text — it sends a
     stable error code, and the table below is where that becomes a sentence. -->
<html lang="__HANDYBOX_LANG__">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8fa"><title>HandyBox · LAN share</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233c5273' stroke-width='1.7' stroke-linecap='round'%3E%3Cpath d='M12 19h.01'/%3E%3Cpath d='M8.5 15.5a5 5 0 0 1 7 0'/%3E%3Cpath d='M5 12a10 10 0 0 1 14 0'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f6f8fa;--surface:#fff;--ink:#263852;--muted:#6f7e88;--line:#e2e8ec;--accent:#3c5273;--accent-hover:#2d405e;--tint:#edf1f7;--success:#3f806b;--error:#aa3737}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
button,a,textarea,input{font:inherit}button,a{touch-action:manipulation}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:var(--tint);color:var(--accent);font-weight:600;transition:background .18s}
button:hover{background:#e2e9f2}button:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible{outline:3px solid #a8bcd6;outline-offset:3px}
.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent-hover)}
main{max-width:1120px;margin:auto;padding:36px 30px 24px}
header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.brand-icon{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--accent)}
.brand h1{font-size:25px;letter-spacing:-.6px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:12px}
.connection{margin-left:auto;flex-shrink:0;white-space:nowrap;border-radius:20px;background:#e5efea;padding:8px 13px;font-size:12px;color:var(--success)}
.connection.offline{background:#f7e6e6;color:var(--error)}
.hero{padding:25px 28px;border-radius:16px;background:var(--tint);display:flex;align-items:center;gap:20px;margin-bottom:25px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#7488a3;font-weight:600;margin:0 0 10px}
.hero h2{margin:0 0 10px;font-size:27px;letter-spacing:-.6px}
.hero p:last-child{color:#65788c;font-size:13px;margin:0;line-height:1.7}
.hero-art{margin-left:auto;width:90px;height:78px;position:relative;flex-shrink:0}
.paper{position:absolute;width:42px;height:56px;border:1px solid #b3c3d6;border-radius:7px;background:#fbfcfe;left:8px;top:5px;transform:rotate(-14deg)}
.paper:after{content:'≡';position:absolute;left:10px;top:8px;font-size:27px;color:#94a8c0}
.paper.second{left:37px;top:17px;transform:rotate(14deg);background:#dde5ef}
.layout{display:grid;grid-template-columns:345px minmax(0,1fr);gap:22px}
.left{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px}
.drop{padding:25px 20px;text-align:center;border:1.5px dashed #c3d0de;transition:background .2s}
.drop.dragging{background:var(--tint);border-color:var(--accent);box-shadow:0 0 0 4px #3c527315}
.upload-icon{width:45px;height:45px;margin:0 auto 12px;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--accent)}
.drop h3{margin:0 0 8px;font-size:18px}.drop p{margin:0 0 20px;font-size:12px;color:var(--muted)}.drop button{width:100%}
.text-card{padding:19px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title h3{margin:0;font-size:15px}
.subtle{font-size:12px;padding:6px 10px;background:transparent;color:var(--accent)}
textarea{display:block;resize:vertical;min-height:126px;width:100%;border:1px solid var(--line);border-radius:9px;background:#fafbfc;color:var(--ink);padding:12px;line-height:1.65;margin:13px 0 9px;outline:none}
textarea:focus{border-color:#93accb;box-shadow:0 0 0 3px #3c527310}textarea::placeholder{color:#a3aeb8}
.text-hint{color:#929ca6;font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}
.text-card .primary{width:100%}
.shared{padding:23px;display:flex;flex-direction:column;min-height:360px}
.shared h2{font-size:19px;margin:0 0 7px}.summary{font-size:12px;color:var(--muted);margin:0}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px}
.filter{margin-top:21px;display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:11px}
.filter button{padding:7px 12px;font-size:12px;color:#8e9bab;background:transparent}
.filter button.active{background:var(--tint);color:var(--accent)}
.search{margin:14px 0 4px;padding:10px 12px;width:100%;border:1px solid var(--line);border-radius:8px;background:#fafbfc;outline:none;color:var(--ink)}
.search:focus{border-color:#93accb}
.file-pane{position:relative;flex:1;min-height:0}.file-list{position:absolute;inset:0;overflow:auto}
.file{content-visibility:auto;contain-intrinsic-size:auto 66px;display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.file-icon{width:34px;height:38px;border-radius:8px;background:var(--tint);color:var(--accent);font-size:10px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.file-icon.binary{background:#eceff3;color:#6b7a8c}
.file-info{min-width:0;flex:1}
.file-name{font-size:13px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0 0 6px}
.file-meta{font-size:11px;color:#98a2ad}
.file-actions{display:flex;gap:5px;flex-shrink:0}
.file-actions button,.file-actions a{font-size:12px;border-radius:7px;padding:7px 9px;text-decoration:none;background:var(--tint);color:var(--accent);border:0;font-weight:500}
.file-actions a:hover{background:#e2e9f2}
.empty{text-align:center;color:#7d8d9c;padding:65px 10px}
.empty-symbol{color:#b6c3d2;margin-bottom:16px}
.empty h3{font-size:15px;font-weight:500}.empty p{font-size:12px;color:#9ba5b0}
.shared-footer{margin-top:18px;padding-top:13px;font-size:11px;color:#a0aab4;display:flex;justify-content:space-between;gap:8px}
footer{margin-top:22px;display:flex;justify-content:space-between;gap:12px;color:#98a2ad;font-size:11px;line-height:1.8}
footer a{color:var(--accent);text-decoration:none}footer a:hover{text-decoration:underline}
.network-note{display:flex;align-items:flex-start;gap:6px}.network-note>span:first-child{flex-shrink:0}
.footer-links{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.footer-links a{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:13px 22px;max-width:min(90%,700px);background:#2c3f57;color:#fff;border-radius:10px;box-shadow:0 8px 28px #26385220;z-index:10;line-height:1.6;white-space:pre-wrap}
#toast.error{background:var(--error)}
.progress{margin-top:15px;text-align:left;font-size:12px;color:var(--accent)}
.progress progress{width:100%;height:7px;accent-color:var(--accent);margin-top:8px}
dialog{width:min(600px,92vw);border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--ink);box-shadow:0 24px 100px #26385230}
dialog::backdrop{background:#26385250;backdrop-filter:blur(3px)}
dialog h3{margin:0;word-break:break-all;font-size:16px}dialog textarea{min-height:260px;background:#fafbfc}
dialog .actions{display:flex;justify-content:flex-end;gap:10px}
.hidden,[hidden]{display:none!important}
@media(max-width:760px){
  main{padding:23px 16px}
  header{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px}
  .brand-icon{width:44px;height:44px}
  .brand{min-width:0}.brand h1{font-size:22px;white-space:nowrap}.brand p{font-size:11px;line-height:1.45}
  .connection{font-size:11px;padding:6px 9px}
  .layout{grid-template-columns:1fr}
  .hero{padding:22px}.hero h2{font-size:23px}.hero-art{display:none}
  .shared{min-height:360px;padding:19px}
  .file-pane{position:static}.file-list{position:static;overflow:visible}
  .shared-footer{flex-direction:column;gap:4px}
  footer{flex-direction:column;align-items:stretch;gap:12px;border-top:1px solid var(--line);padding-top:16px}
  .footer-links{align-items:flex-start;text-align:left;gap:8px}
  .file{gap:10px}.file-actions{gap:4px}.file-actions button,.file-actions a{padding:7px}
  .left{gap:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 19h.01"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M5 12a10 10 0 0 1 14 0"/></svg></div>
  <div class="brand"><h1>HandyBox</h1><p data-t="tagline"></p></div>
  <span class="connection" id="connection" role="status"></span>
</header>
<section class="hero">
  <div><p class="eyebrow" data-t="eyebrow"></p><h2 data-t="hero-title"></h2><p data-t="hero-body"></p></div>
  <div class="hero-art" aria-hidden="true"><div class="paper"></div><div class="paper second"></div></div>
</section>
<div class="layout">
<div class="left">
<section class="card drop" id="drop">
  <div class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
  <h3 data-t="drop-title"></h3><p data-t="drop-hint"></p>
  <button id="choose" data-t="choose"></button>
  <input id="file-input" type="file" multiple hidden>
  <div class="progress" id="progress-area" hidden><span id="progress-label"></span><progress id="progress" max="100" value="0" data-t-aria="progress-label"></progress></div>
</section>
<section class="card text-card">
  <div class="section-title"><h3 data-t="text-title"></h3><button class="subtle" id="paste" data-t="paste"></button></div>
  <label class="hidden" for="draft" data-t="text-label"></label>
  <textarea id="draft" data-t-placeholder="text-placeholder" maxlength="1048576"></textarea>
  <div class="text-hint"><span data-t="text-hint"></span><span id="char-count"></span></div>
  <button class="primary" id="save-text" data-t="save-text" disabled></button>
</section>
</div>
<section class="card shared">
  <div class="tools"><div><h2 data-t="shared-title"></h2><p class="summary" id="summary"></p></div><button class="subtle" id="refresh" data-t="refresh"></button></div>
  <div class="filter" role="group" data-t-aria="filter-group">
    <button class="active" data-filter="all" data-t="filter-all" aria-pressed="true"></button>
    <button data-filter="file" data-t="filter-files" aria-pressed="false"></button>
    <button data-filter="text" data-t="filter-text" aria-pressed="false"></button>
  </div>
  <input class="search" id="search" data-t-placeholder="search" data-t-aria="search">
  <div class="file-pane"><div class="file-list" id="files" aria-live="polite"></div></div>
  <div class="shared-footer"><span id="folder-note"></span><span data-t="sync-note"></span></div>
</section>
</div>
<footer>
  <span class="network-note"><span aria-hidden="true">●</span><span data-t="network-note"></span></span>
  <span class="footer-links"><a id="address" href="/" data-t-title="address-title"></a></span>
</footer>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="preview">
  <h3 id="preview-name"></h3>
  <textarea id="preview-text" readonly data-t-aria="preview-label"></textarea>
  <div class="actions"><button id="close-preview" data-t="close"></button><button class="primary" id="copy-preview" data-t="copy-text"></button></div>
</dialog>
<script>
'use strict';
// Replaced by the server with the language the desktop is showing. Left as the
// placeholder only when this file is opened straight off disk.
const LANG = '__HANDYBOX_LANG__' === 'zh-CN' ? 'zh' : 'en';
const ZH = LANG === 'zh';
const $ = id => document.getElementById(id);

// Every sentence this page can show. The API sends codes, never text, so this
// is the single place where either language is written down.
const TEXT = {
  tagline:        ['Local network sharing',                 '局域网共享'],
  eyebrow:        ['LOCAL NETWORK · SHARED SPACE',          '局域网 · 共享空间'],
  'hero-title':   ['Files and ideas, a moment away.',       '文件与想法，触手可及。'],
  'hero-body':    ['No sign-in. Every device on this network can share files and text here.',
                   '无需登录。这个网络里的任何设备都能在这里共享文件和文字。'],
  connecting:     ['● Connecting',                          '● 正在连接'],
  connected:      ['● Connected',                           '● 已连接'],
  disconnected:   ['● Disconnected',                        '● 已断开'],
  'drop-title':   ['Drop files here',                       '把文件拖到这里'],
  'drop-hint':    ['Multiple files · up to 10 GiB each',    '支持多个文件 · 单个不超过 10 GiB'],
  choose:         ['+ Choose files',                        '+ 选择文件'],
  'progress-label':['Upload progress',                      '上传进度'],
  'text-title':   ['Share some text',                       '共享一段文字'],
  'text-label':   ['Text to share',                         '要共享的文字'],
  paste:          ['Paste',                                 '粘贴'],
  'text-placeholder':['Paste a link, a quick note, or anything you want to share…',
                   '粘贴链接、随手记的内容，或任何想共享的文字…'],
  'text-hint':    ['Saved as a .txt file · up to 1 MiB',    '保存为 .txt 文件 · 不超过 1 MiB'],
  'save-text':    ['Save and share',                        '保存并共享'],
  saving:         ['Saving…',                               '正在保存…'],
  'shared-title': ['Shared space',                          '共享空间'],
  reading:        ['Reading the shared space…',             '正在读取共享空间…'],
  refresh:        ['↻ Refresh',                             '↻ 刷新'],
  'filter-group': ['File type',                             '文件类型'],
  'filter-all':   ['All',                                   '全部'],
  'filter-files': ['Files',                                 '文件'],
  'filter-text':  ['Text',                                  '文字'],
  search:         ['Search file names…',                    '搜索文件名…'],
  'sync-note':    ['Syncs every 2 seconds',                 '每 2 秒同步一次'],
  'folder-note':  ['Files from the host’s shared folder', '来自主机共享文件夹的内容'],
  'network-note': ['Shared on this network only · use it on a network you trust',
                   '仅在本网络内共享 · 请在可信任的网络中使用'],
  'address-title':['Current sharing address',               '当前共享地址'],
  view:           ['View',                                  '查看'],
  'view-aria':    [name => `View ${name}`,                  name => `查看 ${name}`],
  download:       ['Download ↓',                            '下载 ↓'],
  'download-aria':[name => `Download ${name}`,              name => `下载 ${name}`],
  close:          ['Close',                                 '关闭'],
  'copy-text':    ['Copy text',                             '复制文字'],
  'preview-label':['Text content',                          '文字内容'],
  'empty-title':  ['Nothing shared yet — you can be the first', '还没有共享任何内容 —— 你可以是第一个'],
  'empty-body':   ['Files and text you upload will show up here', '你上传的文件和文字会显示在这里'],
  'no-match':     ['No files match your search',            '没有匹配的文件'],
  'no-match-body':['Try another keyword or file type',      '换个关键词或文件类型试试'],
  updated:        ['Shared space updated',                  '共享空间已更新'],
  unreachable:    ['Cannot reach the host — make sure HandyBox is still sharing',
                   '无法连接到主机 —— 请确认 HandyBox 仍在共享'],
  'text-saved':   ['Text saved and shared',                 '文字已保存并共享'],
  'text-copied':  ['Text copied',                           '文字已复制'],
  'select-to-copy':['Text selected — press Ctrl / ⌘ + C, or long-press to copy',
                   '文字已选中 —— 按 Ctrl / ⌘ + C，或长按复制'],
  'paste-manually':['On a plain-HTTP page, press Ctrl / ⌘ + V inside the box; long-press to paste on a phone',
                   '在 HTTP 页面上请在输入框内按 Ctrl / ⌘ + V；手机上长按粘贴'],
  'no-folders':   ['Compress folders before uploading them','请先把文件夹压缩后再上传'],
  'upload-busy':  ['An upload is still running — add more files once it finishes',
                   '还有上传正在进行 —— 请等它结束后再添加'],
  'connection-lost':['Connection lost — check the network and try again',
                   '连接中断 —— 请检查网络后重试'],
  'upload-cancelled':['Upload cancelled',                   '上传已取消'],
  'bad-response': ['The server sent a malformed response',  '服务器返回了无法解析的响应'],
  'request-failed':['Request failed',                       '请求失败'],
  files:          [n => `${n} file${n === 1 ? '' : 's'}`,   n => `${n} 个文件`],
  characters:     [n => `${n} character${n === 1 ? '' : 's'}`, n => `${n} 个字符`],
  shared:         [n => `Shared ${TEXT.files[0](n)}`,       n => `已共享 ${n} 个文件`],
};

// What the API's error codes mean. A code with no entry falls back to the
// generic failure rather than showing the raw token.
const ERRORS = {
  'folder-create':   ['Could not create the shared folder',        '无法创建共享文件夹'],
  'folder-read-only':['The shared folder is not writable',         '共享文件夹不可写入'],
  'folder-read':     ['Could not read the shared folder',          '无法读取共享文件夹'],
  'invalid-name':    ['Invalid file name: paths, hidden files and special characters are not shared',
                      '文件名无效：不支持路径、隐藏文件和特殊字符'],
  'reserved-name':   ['This name is reserved on Windows',          '该名称在 Windows 上是保留名'],
  refused:           ['Open the sharing address shown in HandyBox, then try again',
                      '请打开 HandyBox 中显示的共享地址后重试'],
  'not-file':        ['Please choose a file; compress folders first', '请选择文件；文件夹请先压缩'],
  'too-large':       ['A single file cannot exceed 10 GiB',        '单个文件不能超过 10 GiB'],
  'text-empty':      ['Please enter some text first',              '请先输入一些文字'],
  'text-too-large':  ['Text cannot exceed 1 MiB',                  '文字不能超过 1 MiB'],
  'name-collision':  ['Too many files share this name; rename it and try again',
                      '同名文件过多；请重命名后重试'],
  'file-missing':    ['This file is no longer in the shared folder', '该文件已不在共享文件夹中'],
  read:              ['Could not read this file',                  '无法读取该文件'],
  write:             ['Could not write to the shared folder',      '无法写入共享文件夹'],
  'upload-failed':   ['The upload did not arrive intact. Please try again', '上传未完整送达，请重试'],
};

const t = (key, ...args) => {
  const entry = TEXT[key];
  if (!entry) return key;
  const value = entry[ZH ? 1 : 0];
  return typeof value === 'function' ? value(...args) : value;
};
const errorText = code => (ERRORS[code] || null)?.[ZH ? 1 : 0] || t('request-failed');

// An API failure carries a code; a transport failure carries a key from TEXT.
class Failure extends Error {
  constructor(message) { super(message); }
}
const failure = key => new Failure(t(key));

let entries = [], filter = 'all', uploading = false, saving = false, refreshing = false, toastTimer, lastRender = '';
const size = n => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
  : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB'
  : (n / 1073741824).toFixed(2) + ' GB';

function applyLanguage() {
  document.title = ZH ? 'HandyBox · 局域网共享' : 'HandyBox · LAN share';
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = t(node.dataset.t);
  for (const node of document.querySelectorAll('[data-t-placeholder]')) node.placeholder = t(node.dataset.tPlaceholder);
  for (const node of document.querySelectorAll('[data-t-aria]')) node.setAttribute('aria-label', t(node.dataset.tAria));
  for (const node of document.querySelectorAll('[data-t-title]')) node.title = t(node.dataset.tTitle);
  $('connection').textContent = t('connecting');
  $('summary').textContent = t('reading');
}

function toast(message, error = false) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  $('toast').classList.toggle('error', error);
  $('toast').hidden = false;
  toastTimer = setTimeout(() => $('toast').hidden = true, error ? 8500 : 3500);
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: { 'X-Handybox-Share': '1', ...options.headers },
    signal: AbortSignal.timeout(15000),
  });
  const raw = await response.text();
  let result;
  try { result = JSON.parse(raw); } catch { throw failure('bad-response'); }
  if (!response.ok) throw new Failure(errorText(result.error));
  return result;
}

const fileDate = new Intl.DateTimeFormat(ZH ? 'zh-CN' : 'en-US', {
  month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
});

function render() {
  const query = $('search').value.toLocaleLowerCase();
  const visible = entries.filter(f =>
    (filter === 'all' || (filter === 'text' ? f.is_text : !f.is_text)) &&
    f.name.toLocaleLowerCase().includes(query));
  const key = JSON.stringify(visible) + filter + query;
  if (key === lastRender) return;
  lastRender = key;
  $('files').replaceChildren();
  if (!visible.length) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = '<div class="empty-symbol"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/></svg></div><h3></h3><p></p>';
    div.querySelector('h3').textContent = t(entries.length ? 'no-match' : 'empty-title');
    div.querySelector('p').textContent = t(entries.length ? 'no-match-body' : 'empty-body');
    $('files').append(div);
    return;
  }
  const fragment = document.createDocumentFragment();
  for (const file of visible) {
    const row = document.createElement('div');
    row.className = 'file';
    const icon = document.createElement('div');
    icon.className = 'file-icon' + (file.is_text ? '' : ' binary');
    icon.textContent = file.is_text ? 'TXT'
      : (file.name.split('.').length > 1 ? file.name.split('.').pop().slice(0, 5).toUpperCase() : 'FILE');
    const info = document.createElement('div');
    info.className = 'file-info';
    const name = document.createElement('p');
    name.className = 'file-name';
    name.textContent = file.name;
    name.title = file.name;
    const meta = document.createElement('div');
    meta.className = 'file-meta';
    meta.textContent = size(file.size) + ' · ' + fileDate.format(new Date(file.modified * 1000));
    info.append(name, meta);
    const actions = document.createElement('div');
    actions.className = 'file-actions';
    if (file.is_text) {
      const view = document.createElement('button');
      view.textContent = t('view');
      view.setAttribute('aria-label', t('view-aria', file.name));
      view.onclick = () => previewText(file.name);
      actions.append(view);
    }
    const download = document.createElement('a');
    download.textContent = t('download');
    download.href = '/download/' + encodeURIComponent(file.name);
    download.download = file.name;
    download.setAttribute('aria-label', t('download-aria', file.name));
    actions.append(download);
    row.append(icon, info, actions);
    fragment.append(row);
  }
  $('files').append(fragment);
}

async function refresh(manual = false) {
  if (refreshing) return;
  refreshing = true;
  try {
    entries = await api('/api/files');
    $('summary').textContent = t('files', entries.length) + ' · ' + size(entries.reduce((n, f) => n + f.size, 0));
    $('connection').textContent = t('connected');
    $('connection').classList.remove('offline');
    render();
    if (manual) toast(t('updated'));
  } catch (e) {
    $('connection').textContent = t('disconnected');
    $('connection').classList.add('offline');
    $('summary').textContent = t('unreachable');
    if (manual) toast(e.message, true);
  } finally {
    refreshing = false;
  }
}

function uploadOne(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('X-Handybox-Share', '1');
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => {
      let result;
      try { result = JSON.parse(xhr.responseText); } catch { reject(failure('upload-failed')); return; }
      xhr.status >= 200 && xhr.status < 300
        ? resolve(result)
        : reject(new Failure(errorText(result.error)));
    };
    xhr.onerror = () => reject(failure('connection-lost'));
    xhr.onabort = () => reject(failure('upload-cancelled'));
    const data = new FormData();
    data.append('files', file);
    xhr.send(data);
  });
}

async function upload(files) {
  files = Array.from(files);
  if (!files.length) return;
  if (uploading) { toast(t('upload-busy'), true); return; }
  uploading = true;
  $('choose').disabled = true;
  $('progress-area').hidden = false;
  let success = 0;
  const failed = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      $('progress').value = 0;
      $('progress-label').textContent = (i + 1) + ' / ' + files.length + ' · ' + file.name;
      try {
        if (file.size > 10 * 1024 ** 3) throw new Failure(errorText('too-large'));
        await uploadOne(file, p => {
          $('progress').value = p;
          $('progress-label').textContent = (i + 1) + ' / ' + files.length + ' · ' + p + '% · ' + file.name;
        });
        success++;
        await refresh();
      } catch (e) {
        failed.push(file.name + ': ' + e.message);
      }
    }
    toast(failed.length ? t('shared', success) + '\n' + failed.join('\n') : t('shared', success), !!failed.length);
  } finally {
    uploading = false;
    $('choose').disabled = false;
    $('progress-area').hidden = true;
    $('file-input').value = '';
    refresh();
  }
}

function updateDraft() {
  $('char-count').textContent = t('characters', $('draft').value.length);
  $('save-text').disabled = saving || !$('draft').value.trim();
}

async function previewText(name) {
  try {
    const result = await api('/api/text/' + encodeURIComponent(name));
    $('preview-name').textContent = name;
    $('preview-text').value = result.text;
    $('preview').showModal();
  } catch (e) { toast(e.message, true); }
}

applyLanguage();
updateDraft();
$('folder-note').textContent = t('folder-note');
$('choose').onclick = () => $('file-input').click();
$('file-input').onchange = e => upload(e.target.files);

let dragDepth = 0;
document.addEventListener('dragenter', e => {
  if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); dragDepth++; $('drop').classList.add('dragging'); }
});
document.addEventListener('dragover', e => {
  if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
});
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.remove('dragging'); } });
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  $('drop').classList.remove('dragging');
  const items = Array.from(e.dataTransfer.items);
  if (items.some(i => i.webkitGetAsEntry?.()?.isDirectory)) { toast(t('no-folders'), true); return; }
  upload(e.dataTransfer.files);
});

$('draft').oninput = updateDraft;
$('paste').onclick = async () => {
  try {
    if (!navigator.clipboard?.readText) throw new Error();
    const text = await navigator.clipboard.readText();
    $('draft').setRangeText(text, $('draft').selectionStart, $('draft').selectionEnd, 'end');
    updateDraft();
  } catch {
    $('draft').focus();
    toast(t('paste-manually'));
  }
};
$('save-text').onclick = async () => {
  const text = $('draft').value;
  if (!text.trim()) return;
  if (new TextEncoder().encode(text).length > 1048576) { toast(errorText('text-too-large'), true); return; }
  saving = true;
  updateDraft();
  $('draft').disabled = true;
  $('paste').disabled = true;
  $('save-text').textContent = t('saving');
  try {
    await api('/api/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    $('draft').value = '';
    toast(t('text-saved'));
    await refresh();
  } catch (e) {
    toast(e.message, true);
  } finally {
    saving = false;
    $('draft').disabled = false;
    $('paste').disabled = false;
    $('save-text').textContent = t('save-text');
    updateDraft();
  }
};

$('close-preview').onclick = () => $('preview').close();
$('copy-preview').onclick = async () => {
  const area = $('preview-text');
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(area.value);
    else { area.focus(); area.select(); if (!document.execCommand('copy')) throw new Error(); }
    toast(t('text-copied'));
  } catch {
    area.focus();
    area.select();
    toast(t('select-to-copy'));
  }
};

$('search').oninput = render;
document.querySelectorAll('[data-filter]').forEach(button => button.onclick = () => {
  filter = button.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(other => {
    other.classList.toggle('active', other === button);
    other.setAttribute('aria-pressed', String(other === button));
  });
  render();
});
$('refresh').onclick = () => refresh(true);
$('address').textContent = location.host;
$('address').href = location.origin;
window.addEventListener('beforeunload', e => { if (uploading || saving) { e.preventDefault(); e.returnValue = ''; } });
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
