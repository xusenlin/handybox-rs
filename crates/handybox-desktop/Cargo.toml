[package]
name = "handybox-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast, offline-first desktop utility toolbox built with Rust and Slint."

[[bin]]
name = "handybox"
path = "src/main.rs"

[dependencies]
handybox-core = { path = "../handybox-core" }
anyhow.workspace = true
tempfile.workspace = true
directories = "6"
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-femtovg", "renderer-software", "accessibility"] }
# Version-coupled with Slint: provides window-drop events and renderer fallback.
i-slint-backend-winit = { version = "=1.13.1", features = ["x11", "renderer-femtovg", "renderer-software"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
futures-lite = "2"
clipboard-rs = { version = "0.3.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
slint-build = "=1.13.1"
