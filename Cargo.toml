[workspace]
members = ["crates/handybox-core", "crates/handybox-desktop"]
default-members = ["crates/handybox-desktop"]
# Build-time asset tool only; its output is committed, so it stays out of the
# workspace and out of the application's dependency graph.
exclude = ["scripts/icon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
tempfile = "3"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

